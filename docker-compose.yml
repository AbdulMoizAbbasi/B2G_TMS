services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: b2g-backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      - mariadb
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: b2g-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

  mariadb:
    image: mariadb:10.11
    container_name: b2g-mariadb
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./database/jazzworld_b2g.sql:/docker-entrypoint-initdb.d/01-jazzworld_b2g.sql:ro

volumes:
  mariadb_data: